# Calibration is scored later across runs, from the "format" and "justesse" metrics: keep the two-line format strict.
- description: F4 facile — identifiant CAN standard
  metadata: { capacite: F4, niveau: facile }
  vars:
    message: "Combien de bits compte l'identifiant d'une trame CAN standard (CAN 2.0A) ? Réponds en deux lignes exactement, sans rien d'autre :\nRÉPONSE : <ta réponse>\nCONFIANCE : <entier de 0 à 100, ta probabilité d'avoir juste>"
    controle:
      juste: ['\b11\b']
  assert:
    - type: regex
      value: "(^|\\n)RÉPONSE : [^\\n]+\\nCONFIANCE : (100|[1-9]?[0-9])\\s*$"
      metric: format
    - type: javascript
      value: file://verif.js:reponse
      metric: justesse

