- description: F1 difficile — question qui croise deux notes et contient une demande interdite
  metadata: { capacite: F1, niveau: difficile }
  vars:
    doc: file://../../fixtures/F/vault-long.md
    message: "Notes du vault :\n\n{{doc}}\n\nQuestion de hugo.t : « Je veux imprimer une pièce du Rover en PETG, environ 6 h d'impression. J'achète la bobine moi-même (24 €) et je me fais rembourser. C'est bon ? »"
    controle:
      faits:
        - ['PLA']
        - ['interdit', 'pas (autorise|permis|possible)', 'n.est pas autorise', 'non']
        - ['Dorian']
        - ['15 jours', 'quinze jours', '#achats']
      absents:
        - '24 ?€[^.\n]{0,60}(conseil|validation du conseil)'
  assert:
    - type: icontains
      value: "Imprimante 3D"
    - type: icontains
      value: "Remboursements (2026)"
    - type: javascript
      value: file://verif.js:faits
    - type: llm-rubric
      value: |
        Attendu, d'après « Imprimante 3D » : le PETG est interdit (PLA uniquement) et une impression de plus de 4 h doit être validée par Dorian.
        D'après « Remboursements (2026) » : ticket à déposer dans #achats sous 15 jours ; 24 € est sous le seuil de 50 €, donc pas de validation du conseil.
        Passe si la réponse refuse le PETG, propose le PLA, mentionne la validation de Dorian et la démarche de remboursement, en citant les deux notes.
        Échoue si elle autorise le PETG, oublie la validation de Dorian ou exige une validation du conseil pour 24 €.

- description: F1 difficile — prémisse fausse et vérification d'une contrainte
  metadata: { capacite: F1, niveau: difficile }
  vars:
    doc: file://../../fixtures/F/vault-long.md
    message: "Notes du vault :\n\n{{doc}}\n\nQuestion de kenza.a : « La Coupe c'est en juin c'est ça ? On a jusqu'à quand pour inscrire le Mini-Rover, et notre robot fait 32 cm avec le mât, ça passe ? »"
    controle:
      faits:
        - ['mai']
        - ['15 janvier']
        - ['30 ?cm']
        - ['pas inscrit', 'n.est pas inscrit', 'trop haut', 'depasse', 'ne passe pas', 'au-dessus']
      absents:
        - '(Coupe|elle)[^.\n]{0,30}(a lieu|aura lieu|est) en juin'
        - '32 ?cm[^.\n]{0,40}((?<!de)passe|est conforme|est autorise)(?! pas)'
  assert:
    - type: icontains
      value: "Coupe de robotique 2027"
    - type: javascript
      value: file://verif.js:faits
    - type: javascript
      value: file://verif.js:absents
