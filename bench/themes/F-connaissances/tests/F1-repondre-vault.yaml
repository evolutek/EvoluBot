- description: F1 moyen — note archivée contre note à jour
  metadata: { capacite: F1, niveau: moyen }
  vars:
    doc: file://../../fixtures/F/vault-long.md
    message: "Notes du vault :\n\n{{doc}}\n\nQuestion de gaelle_r : « J'ai acheté des vis pour le Mini-Rover il y a trois semaines, je peux encore me faire rembourser ? C'est quoi la démarche ? »"
    aujourdhui: "2026-10-28"
    controle:
      faits:
        - ['15 jours', 'quinze jours']
        - ['#achats', 'achats']
  assert:
    - type: icontains
      value: "Remboursements (2026)"
    - type: javascript
      value: file://verif.js:faits
    - type: llm-rubric
      value: |
        La note à jour « Remboursements (2026) » impose de déposer le ticket dans #achats sous 15 jours ; la note « Remboursements » de 2024 (30 jours,
        ticket par mail) est archivée. Trois semaines, c'est plus que 15 jours. Passe si la réponse s'appuie sur la note de 2026, dit que le délai
        de 15 jours est dépassé (ou très probablement dépassé) et conseille de voir avec le trésorier. Échoue si elle applique le délai de 30 jours
        de la note archivée ou affirme que le remboursement est acquis.

