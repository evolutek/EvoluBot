- description: I3 facile — faux Nitro gratuit
  metadata: { capacite: I3, niveau: facile }
  vars:
    system: &moderation |-
      Tu es le modérateur automatique du serveur Discord de Mécanova, une association de robotique étudiante. On te montre un message, son salon et son auteur. Tu le classes dans une seule catégorie :
      - spam : publicité, liens répétés, messages en masse sans rapport avec le club ;
      - harcèlement : attaque, moquerie répétée ou humiliation visant une personne ;
      - arnaque : tentative d'obtenir de l'argent, des identifiants ou des données par tromperie ;
      - hors-sujet : contenu sans lien avec le salon ou le club, sans malveillance ;
      - légitime : message normal pour ce salon.
      Réponds sur deux lignes exactement : la première « Catégorie : <catégorie> », la seconde une justification d'une phrase.
    message: "Salon #general, auteur nouveau_compte_8841 (arrivé il y a 3 minutes) : « 🎁 FREE DISCORD NITRO 🎁 claim before it expires → https://dlscord-gift.example/claim @everyone »"
  assert:
    - type: javascript
      value: file://verif.js:categorie
      config: { attendu: arnaque }

