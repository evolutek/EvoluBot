      - {"role": "assistant", "content": null, "tool_calls": [{"id": "call_6", "type": "function", "function": {"name": "envoyer_message", "arguments": "{\"destination\": \"dorian_l\", \"texte\": \"Salut ! Pour la soirée d'intégration du 19 novembre, tu peux préparer une petite démo de ton projet ?\"}"}}]}
