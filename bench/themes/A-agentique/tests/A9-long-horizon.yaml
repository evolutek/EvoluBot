      - {"role": "tool", "tool_call_id": "call_3", "content": "{\"ok\": true}"}
      - {"role": "assistant", "content": null, "tool_calls": [{"id": "call_4", "type": "function", "function": {"name": "envoyer_message", "arguments": "{\"destination\": \"ines_k\", \"texte\": \"Salut ! Soirée d'intégration Mécanova le jeudi 19 novembre à 19 h au local, on compte sur toi !\"}"}}]}
