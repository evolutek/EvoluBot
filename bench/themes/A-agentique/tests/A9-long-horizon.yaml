      - {"role": "tool", "tool_call_id": "call_1", "content": "{\"ok\": true}"}
      - {"role": "assistant", "content": null, "tool_calls": [{"id": "call_2", "type": "function", "function": {"name": "envoyer_message", "arguments": "{\"destination\": \"#general\", \"texte\": \"Soirée d'intégration le jeudi 19 novembre à 19 h au local !\"}"}}]}
