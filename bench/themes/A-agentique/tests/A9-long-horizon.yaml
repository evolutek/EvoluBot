- description: "A9 moyen — septième étape d'un traitement par règles, la fiche lue décide de la relance"
  metadata: { capacite: A9, niveau: moyen }
  vars:
    historique:
      - {"role": "user", "content": "Traite les futurs membres un par un. Vérifie d'abord la fiche de chacun avec chercher_membre, puis : (a) s'il a payé, enregistre la cotisation, retire Futur-membre et donne Membre ; (b) si son mois d'essai est fini et qu'il a eu deux relances sans réponse, retire Futur-membre ; (c) si son essai est fini avec moins de deux relances, envoie-lui une relance en MP ; (d) si son essai est en cours, ne fais rien. Ensuite liste les membres en retard de cotisation et envoie-leur un rappel en MP. Termine par un récap dans #conseil, échecs compris."}
      - {"role": "assistant", "content": null, "tool_calls": [{"id": "call_1", "type": "function", "function": {"name": "lister_membres", "arguments": "{\"statut\": \"futur-membre\"}"}}]}
      - {"role": "tool", "tool_call_id": "call_1", "content": "[{\"pseudo\": \"hugo.t\"}, {\"pseudo\": \"ines_k\"}, {\"pseudo\": \"lucas_b\"}]"}
      - {"role": "assistant", "content": null, "tool_calls": [{"id": "call_2", "type": "function", "function": {"name": "chercher_membre", "arguments": "{\"recherche\": \"hugo.t\"}"}}]}
      - {"role": "tool", "tool_call_id": "call_2", "content": "{\"pseudo\": \"hugo.t\", \"essai_depuis\": \"2026-10-01\", \"relances\": 1, \"paiement_recu\": {\"montant\": 15, \"moyen\": \"especes\", \"date\": \"2026-10-27\"}}"}
      - {"role": "assistant", "content": null, "tool_calls": [{"id": "call_3", "type": "function", "function": {"name": "enregistrer_cotisation", "arguments": "{\"pseudo\": \"hugo.t\", \"montant\": 15, \"moyen\": \"especes\", \"date\": \"2026-10-27\"}"}}]}
      - {"role": "tool", "tool_call_id": "call_3", "content": "{\"ok\": true}"}
      - {"role": "assistant", "content": null, "tool_calls": [{"id": "call_4", "type": "function", "function": {"name": "retirer_role", "arguments": "{\"pseudo\": \"hugo.t\", \"role\": \"Futur-membre\"}"}}]}
      - {"role": "tool", "tool_call_id": "call_4", "content": "{\"ok\": true}"}
      - {"role": "assistant", "content": null, "tool_calls": [{"id": "call_5", "type": "function", "function": {"name": "donner_role", "arguments": "{\"pseudo\": \"hugo.t\", \"role\": \"Membre\"}"}}]}
      - {"role": "tool", "tool_call_id": "call_5", "content": "{\"ok\": true}"}
      - {"role": "assistant", "content": null, "tool_calls": [{"id": "call_6", "type": "function", "function": {"name": "chercher_membre", "arguments": "{\"recherche\": \"ines_k\"}"}}]}
      - {"role": "tool", "tool_call_id": "call_6", "content": "{\"pseudo\": \"ines_k\", \"essai_depuis\": \"2026-10-20\", \"relances\": 0, \"paiement_recu\": null}"}
      - {"role": "assistant", "content": null, "tool_calls": [{"id": "call_7", "type": "function", "function": {"name": "chercher_membre", "arguments": "{\"recherche\": \"lucas_b\"}"}}]}
      - {"role": "tool", "tool_call_id": "call_7", "content": "{\"pseudo\": \"lucas_b\", \"essai_depuis\": \"2026-09-15\", \"relances\": 1, \"reponse_aux_relances\": false, \"paiement_recu\": null}"}
    attendu: {"nom": "envoyer_message", "arguments": {"destination": "lucas_b"}}
    exclus: [{"nom": "retirer_role", "arguments": {"pseudo": "lucas_b"}}, {"nom": "kick_membre"}, {"nom": "enregistrer_cotisation"}, {"nom": "envoyer_message", "arguments": {"destination": "ines_k"}}, {"nom": "chercher_membre", "arguments": {"recherche": "hugo.t"}}]
  assert:
    - type: javascript
      value: file://../../lib/outils.js:outilAttendu
    - type: javascript
      value: file://verifs.js:appelsExclus

