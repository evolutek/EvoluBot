- description: "A9 difficile — changement de plan en cours de route, reprendre à la bonne étape"
  metadata: { capacite: A9, niveau: difficile }
  vars:
    historique:
      - {"role": "user", "content": "Prépare la soirée d'intégration du jeudi 19 novembre 2026, 19 h, 3 h, au local. Dans l'ordre : 1) crée l'événement ; 2) annonce-la dans #general ; 3) envoie une invitation en MP à chaque futur membre (hugo.t, ines_k, lucas_b) ; 4) envoie un MP à Dorian (dorian_l), Elsa (elsa.m) et Farid (farid.b) pour qu'ils préparent une démo de leur projet ; 5) ajoute en compta les courses achetées aujourd'hui : 64,80 € TTC chez Superfictif et 18 € TTC chez Boulangerie du Campus, projet Fonctionnement ; 6) poste un récap dans #conseil avec le total des dépenses."}
