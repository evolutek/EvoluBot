    doc: file://../../fixtures/E/archive-30k.md
    message: "{{doc}}\n\nD'après ces archives, quel est le code du cadenas de l'armoire à LiPo ? Termine par une ligne « RÉPONSE : <code> »."
    controle:
      juste: ['4 ?-? ?7 ?-? ?1 ?-? ?9']
  assert:
    - type: javascript
      value: file://verif.js:reponse

