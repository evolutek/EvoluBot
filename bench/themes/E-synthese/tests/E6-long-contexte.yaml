    doc: file://../../fixtures/E/archive-120k.md
    message: "{{doc}}\n\nQuel est le total des dépenses CanSat validées par le trésorier sur toute la période, en tenant compte des annulations ? Les propositions non validées ne comptent pas. Détaille les lignes retenues, puis termine par une ligne « RÉPONSE : <total en euros> »."
