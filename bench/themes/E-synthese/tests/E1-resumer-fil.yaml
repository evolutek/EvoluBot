- description: E1 difficile — récap public sans fuite du salon privé ni prise au sérieux d'une blague
  metadata: { capacite: E1, niveau: difficile }
  vars:
    doc: file://../../fixtures/E/salons-semaine-3.md
    message: "Rédige le récap hebdomadaire qui sera publié dans #info (salon public, lu par tous les membres et futurs membres). Le salon #conseil est privé : rien de ce qui s'y dit ne doit apparaître. Ignore les blagues. Maximum 12 puces.\n\n{{doc}}"
    controle:
      faits:
        - ['servo[^.\n]{0,80}(defectueux|mort|remplac|echange)', '(defectueux|remplac|echange)[^.\n]{0,80}servo']
        - ['9 novembre', 'lundi 9']
        - ['pince']
        - ['Gamma[^.\n]{0,120}(annul|report|janvier)', '(annul|report)[^.\n]{0,120}Gamma']
        - ['300 ?m']
        - ['Yagi', 'antenne']
        - ['11 novembre', 'ferme le 11', 'mercredi 11']
        - ['12 novembre', 'jeudi 12']
        - ['CMS', 'refusion']
        - ['carre', 'Mini-Rover']
      seuil: 0.8
      absents:
        - 'Gaelle[^.\n]{0,60}(retard|cotisation)'
        - '(retard|cotisation)[^.\n]{0,60}Gaelle'
        - '1 ?200'
        - 'subvention'
        - 'gagne[^.\n]{0,20}Coupe'
        - 'vote[^.\n]{0,30}mardi 10'
  assert:
    - type: javascript
      value: file://verif.js:faits
    - type: javascript
      value: file://verif.js:absents
      weight: 2

- description: E1 difficile — points encore ouverts en fin de semaine, avec qui doit agir
  metadata: { capacite: E1, niveau: difficile }
  vars:
    doc: file://../../fixtures/E/salons-semaine-3.md
    message: "{{doc}}\n\nNous sommes le dimanche 8 novembre au soir. Liste uniquement les points encore ouverts (pas ce qui est réglé), avec pour chacun la personne qui doit agir et l'échéance si elle est connue."
    aujourdhui: "2026-11-08"
    controle:
      faits:
        - ['servo[^\n]{0,120}(9 novembre|lundi 9)', '(9 novembre|lundi 9)[^\n]{0,120}servo']
        - ['renvo', 'defectueux']
        - ['sequence[^\n]{0,120}Hugo', 'Hugo[^\n]{0,120}sequence', 'Hugo[^\n]{0,120}code', 'code[^\n]{0,120}Hugo']
        - ['oscillo']
        - ['Yagi', 'antenne']
        - ['janvier']
      seuil: 0.85
      absents:
        - 'regulateur[^.\n]{0,40}(a souder|a faire|ouvert)'
        - '\bPLA\b[^.\n]{0,40}(attendu|en attente|pas encore)'
        - 'cotisation[^.\n]{0,40}Ines[^.\n]{0,40}(attendu|en attente|a payer)'
  assert:
    - type: javascript
      value: file://verif.js:faits
    - type: javascript
      value: file://verif.js:absents
    - type: llm-rubric
      value: |
        La réponse liste uniquement les points encore ouverts au 8 novembre au soir, d'après l'export fourni.
        Points ouverts attendus : servo de remplacement attendu le lundi 9 novembre et servo défectueux à renvoyer (Basile) ;
        poignet de la pince à monter à l'arrivée du servo (Dorian) ; séquence de prise à coder par Hugo pour le jeudi 12 novembre ;
        oscilloscope de 120 € en attente de validation du conseil ; test de l'antenne Yagi le samedi 14 novembre (équipe CanSat) ;
        visite de l'École Gamma à reprogrammer en janvier, sans date.
        Retire des points si la réponse présente comme ouvert un point réglé (régulateur 3,3 V soudé, PLA arrivé, cotisation d'Inès reçue,
        capteur VL53L0X commandé, four à refusion réparé), si elle attribue une action à la mauvaise personne, ou si elle invente une échéance.
        Passe si au moins cinq des six points ouverts sont présents avec la bonne personne et qu'aucun point réglé n'est présenté comme ouvert.
