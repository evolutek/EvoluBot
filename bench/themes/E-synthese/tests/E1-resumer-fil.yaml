- description: E1 facile — récap général d'une semaine calme
  metadata: { capacite: E1, niveau: facile }
  vars:
    doc: file://../../fixtures/E/salons-semaine-1.md
    message: "Voici l'export des salons Discord de la semaine :\n\n{{doc}}\n\nFais le récap de la semaine pour #info, en puces courtes, un salon après l'autre."
    controle:
      faits:
        - 'moteurs'
        - ['motricit', 'roule']
        - 'parachute'
        - ['largage', 'larg']
        - ['9 ?m/s', '9 metres']
        - ['89[,.]90', 'batteries']
        - ['29 octobre', '29/10', 'jeudi 29']
        - ['26 novembre', '26/11', '\bAG\b', 'assemblee generale']
        - ['15 novembre', '15/11']
        - ['\bInes', 'ines_k']
      seuil: 0.9
  assert:
    - type: javascript
      value: file://verif.js:faits

- description: E1 facile — ce qui a changé dans le planning
  metadata: { capacite: E1, niveau: facile }
  vars:
    doc: file://../../fixtures/E/salons-semaine-1.md
    message: "{{doc}}\n\nJe n'ai lu que #general cette semaine. Qu'est-ce qui a changé ou été fixé dans le planning du club ? Liste les dates."
    controle:
      faits:
        - ['29 octobre', '29/10', 'jeudi 29']
        - ['annul', 'report', 'panne']
        - ['24 octobre', '24/10', 'samedi 24']
        - ['21 octobre', 'mercredi 21', 'motricit']
      seuil: 1
      absents:
        - 'atelier[^.\n]{0,40}(maintenu|a bien lieu)[^.\n]{0,20}22'
  assert:
    - type: javascript
      value: file://verif.js:faits
    - type: javascript
      value: file://verif.js:absents

