- description: J1 moyen — lignes de facture et sous-totaux
  metadata: { capacite: J1, niveau: moyen }
  vars:
    image: file://../../fixtures/J/facture.png
    message: "Recopie les lignes de cette facture pour la compta. JSON uniquement : {\"lignes\": [{\"designation\", \"quantite\" (nombre), \"prix_unitaire_ht\" (nombre), \"total_ht\" (nombre)}] dans l'ordre de la facture, \"total_ht\", \"tva\" (nombres)}."
    controle:
      attendu:
        lignes.0.designation: { motif: 'moteur' }
        lignes.0.quantite: 4
        lignes.0.prix_unitaire_ht: 18.50
        lignes.0.total_ht: 74.00
        lignes.1.designation: { motif: 'roue' }
        lignes.1.quantite: 4
        lignes.1.prix_unitaire_ht: 3.20
        lignes.2.designation: { motif: 'driver|pont' }
        lignes.2.quantite: 2
        lignes.2.prix_unitaire_ht: 22.50
        lignes.2.total_ht: 45.00
        total_ht: 131.80
        tva: 26.36
  assert:
    - type: javascript
      value: file://verif.js:champs

