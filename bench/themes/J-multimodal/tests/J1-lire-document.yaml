- description: J1 difficile — total TTC imprimé faux sur une photo
  metadata: { capacite: J1, niveau: difficile }
  vars:
    image: file://../../fixtures/J/facture-photo.jpg
    message: "Avant de saisir cette facture, vérifie les calculs (lignes, total HT, TVA, TTC). Dis s'il y a une erreur et laquelle. Termine par une ligne « RÉPONSE : correcte » ou « RÉPONSE : erreur ; TTC attendu <montant> »."
    controle:
      juste: ['erreur', '85[,.]20?']
      faux: ['(?<!in)correcte']
      faits:
        - ['87[,.]20?']
  assert:
    - type: javascript
      value: file://verif.js:reponse
      weight: 2
    - type: javascript
      value: file://verif.js:faits
