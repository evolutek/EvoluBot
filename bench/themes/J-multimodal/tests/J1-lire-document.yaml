- description: J1 facile — en-tête et total d'une facture nette
  metadata: { capacite: J1, niveau: facile }
  vars:
    image: file://../../fixtures/J/facture.png
    message: "Voici une facture. Réponds uniquement avec un JSON : {\"fournisseur\", \"numero_facture\", \"date_facture\" (AAAA-MM-JJ), \"montant_ttc\" (nombre)}."
